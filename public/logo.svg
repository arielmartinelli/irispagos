<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo gradiente premium estilo iOS Apple Wallet / Finanzas -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- Gradiente para el orbe / aro financiero -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Resplandor sutil interior -->
    <radialGradient id="glowGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Sombra suave para los elementos centrales -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fondo redondeado con esquinas redondeadas estilo iOS App Icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="115" fill="url(#glowGrad)"/>

  <!-- Anillo exterior brillante -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round" opacity="0.85" filter="url(#dropShadow)"/>

  <!-- Billetera / Tarjeta estilizada con símbolo monetario -->
  <g filter="url(#dropShadow)" transform="translate(136, 136)">
    <!-- Tarjeta trasera inclinada -->
    <rect x="36" y="24" width="168" height="110" rx="20" fill="#27272a" stroke="rgba(255,255,255,0.15)" stroke-width="3" transform="rotate(-6 120 79)"/>

    <!-- Tarjeta principal frontal con gradiente -->
    <rect x="20" y="44" width="200" height="130" rx="24" fill="#18181b" stroke="url(#accentGrad)" stroke-width="4"/>

    <!-- Banda magnética / chip -->
    <rect x="42" y="72" width="38" height="28" rx="6" fill="url(#accentGrad)" opacity="0.9"/>
    
    <!-- Símbolo de dinero / cheque de pago -->
    <circle cx="170" cy="109" r="28" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="3"/>
    <path d="M170 94 v30 M163 101 c0 -5 14 -5 14 0 c0 6 -14 4 -14 9 c0 5 14 5 14 0" fill="none" stroke="#10b981" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Flechas circulares de flujo / sincronización de pago -->
  <path d="M 220 375 L 292 375" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round"/>
</svg>
